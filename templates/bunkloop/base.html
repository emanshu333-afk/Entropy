{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bunkloop{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="site-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'bunkloop:home' %}">
                <span class="brand-mark">b</span>
                <span>Bunkloop</span>
            </a>
            <nav class="topnav" aria-label="Main navigation">
                <a href="{% url 'bunkloop:home' %}">Browse</a>
                <a href="{% url 'bunkloop:item_create' %}">Post an item</a>
                <a href="{% url 'bunkloop:profile' %}">Profile</a>
            </nav>
            <a class="button button-small button-primary" href="{% url 'bunkloop:item_create' %}">+ Post item</a>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
