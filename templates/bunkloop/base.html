{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bunkloop{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" href="{% static 'images/logo.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="site-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'bunkloop:home' %}" aria-label="Bunkloop home">
                <img class="brand-logo" src="{% static 'images/logo.png' %}" alt="Bunkloop logo" onerror="this.style.display='none'">
            </a>
            <nav class="topnav" aria-label="Main navigation">
                <a href="{% url 'bunkloop:home' %}">Browse</a>
                <a href="{% url 'bunkloop:my_items' %}">My items</a>
                <a href="{% url 'bunkloop:item_create' %}">Post an item</a>
            </nav>
            <a class="button button-small button-primary" href="{% url 'bunkloop:profile' %}">Profile</a>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
