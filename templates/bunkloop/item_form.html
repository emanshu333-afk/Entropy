{% extends 'bunkloop/base.html' %}

{% block title %}Post an Item{% endblock %}

{% block content %}
<section class="container form-shell">
    <h1>Post an item</h1>

    <form class="listing-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field-group">
            <label for="category">Item category</label>
            <select id="category" name="category">
                <option value="">Select category</option>
                <option value="books">Books</option>
                <option value="electronics">Electronics</option>
                <option value="furniture">Furniture</option>
                <option value="sports">Sports</option>
            </select>
        </div>

        <div class="field-group">
            <label>Upload photos</label>
            <div class="image-upload-box">
                <input type="file" name="images" accept="image/*" capture="environment" multiple>
                <small>Up to 4 images</small>
            </div>
        </div>

        <div class="field-group radio-group">
            <label>Listing type</label>
            <div class="options">
                <label><input type="radio" name="listing_type" value="sell" checked> Sell</label>
                <label><input type="radio" name="listing_type" value="rent"> Rent</label>
            </div>
        </div>

        <div class="field-group">
            <label for="price">Price</label>
            <input id="price" type="number" name="price" min="0" step="0.01" placeholder="Enter price">
        </div>

        <div class="field-group">
            <label for="condition">Condition</label>
            <select id="condition" name="condition">
                <option value="new">New</option>
                <option value="like_new">Like New</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
                <option value="needs_repair">Needs Repair</option>
            </select>
        </div>

        <div class="field-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Briefly describe the item"></textarea>
        </div>

        <button type="submit" class="primary-btn">List item</button>
    </form>
</section>
{% endblock %}
