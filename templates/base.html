{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entropy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'entropy.css' %}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="{% url 'marketplace:home' %}"><span class="brand-mark">e</span><span class="wordmark">entropy</span></a>
      <div class="workspace">Campus marketplace / 2026</div>
      <nav class="nav" aria-label="Main navigation">
        <a class="active" href="{% url 'marketplace:home' %}"><span class="nav-icon">⌂</span>Marketplace</a>
        <a href="{% url 'listings:create' %}"><span class="nav-icon">＋</span>Post an item</a>
        <a href="{% url 'listings:mine' %}"><span class="nav-icon">▣</span>My listings</a>
        <a href="{% url 'messaging:inbox' %}"><span class="nav-icon">◌</span>Messages</a>
        <a href="{% url 'profiles:me' %}"><span class="nav-icon">○</span>My profile</a>
      </nav>
      <div class="sidebar-footer"><div class="user-chip"><span class="avatar">AS</span>Arjun Sharma</div><span>Verified at North Campus</span></div>
    </aside>
    <main class="main">
      <header class="topbar"><span class="crumb">North Campus <span class="muted">/ Marketplace</span></span><div class="top-actions"><input class="search" type="search" placeholder="Search the marketplace..." aria-label="Search marketplace"><a class="btn btn-primary" href="{% url 'listings:create' %}">＋ Post an item</a></div></header>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
