{% extends "base.html" %}
{% block title %}Post an item | Entropy{% endblock %}
{% block content %}<section class="content"><div class="eyebrow">Share with your community</div><h1 class="page-title">Post an item</h1><p class="lead">Give something useful a second life on campus.</p><form class="panel" style="margin-top:28px" method="post" enctype="multipart/form-data">{% csrf_token %}<div class="form-grid"><div class="field full"><label for="title">What are you listing?</label><input id="title" name="title" placeholder="e.g. Compact study table" required></div><div class="field"><label for="category">Category</label><select id="category" name="category"><option>Books and Notes</option><option>Electronics</option><option>Furniture</option><option>Room Essentials</option><option>Cycles and Transport</option><option>Other</option></select></div><div class="field"><label for="type">Transaction type</label><select id="type" name="transaction_type"><option>Sell</option><option>Rent</option></select></div><div class="field"><label for="price">Price or rental rate</label><input id="price" name="price" placeholder="₹ 0" required></div><div class="field"><label for="condition">Condition</label><select id="condition" name="condition"><option>New</option><option>Like New</option><option>Good</option><option>Used</option></select></div><div class="field full"><label for="description">Description</label><textarea id="description" name="description" placeholder="Add details someone should know before reaching out..." required></textarea></div><div class="field"><label for="pickup">Pickup location</label><input id="pickup" name="pickup_location" placeholder="e.g. Hostel reception, Block B" required></div><div class="field"><label for="images">Photos</label><input id="images" name="images" type="file" accept="image/*" multiple required></div></div><div class="form-actions"><a class="btn btn-quiet" href="{% url 'marketplace:home' %}">Cancel</a><button class="btn btn-primary" type="submit">Publish listing</button></div></form></section>{% endblock %}
